name: Daily CCQS Pipeline

on:
  schedule:
    # Single daily cron, AFTER the US close in BOTH DST regimes:
    #   21:15 UTC = 4:15 PM ET in winter (EST) / 5:15 PM ET in summer (EDT).
    # Always at or after the 4:00 PM ET close, so today's EOD bars are
    # available from yfinance.
    #
    # WHY A SINGLE CRON (2026-06-23 fix): we previously used two crons
    # (20:00 + 21:00 UTC) plus a guard that proceeded ONLY when the ET hour
    # was *exactly* 16, to hit 4:00 PM ET sharp in both DST regimes. But
    # GitHub routinely delays scheduled jobs (often 30-120 min at the
    # US-close peak), so the delayed firing landed at 17:00-18:00 ET and the
    # exact-hour guard SKIPPED it — the daily refresh was silently dropped on
    # many days (e.g. 06-19 and 06-23) and only landed when run manually. A
    # single after-close cron + a tolerant guard (ET hour >= 16) runs
    # reliably no matter how late GitHub fires it. Trade-off: the refresh is
    # ~15-75 min after the close instead of at 4:00 sharp; the EOD data is
    # identical either way. The data-quality + cache-freshness gates still
    # catch any case where today's close is somehow missing.
    - cron: '15 21 * * 1-5'
  workflow_dispatch: {}  # manual trigger from Actions UI (always runs)

# Need write access to push the refreshed dashboard cache back to main.
permissions:
  contents: write

# Phase 30.6 — serialize pipeline runs. A scheduled cron and a manual
# dispatch firing close together would both try to commit to main and
# race on push. With concurrency.group set, GitHub Actions queues the
# second invocation behind the first instead of running them in parallel.
# cancel-in-progress: false → never kill a real refresh midway through.
concurrency:
  group: ccqs-daily-pipeline
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------
  # After-close guard. Always runs (cheap); signals should_run=true when the
  # ET wall-clock hour is >= 16 (at or after the 4 PM close), so it tolerates
  # GitHub's scheduled-run delays instead of skipping a late firing.
  # Manual workflow_dispatch always proceeds (bypasses the hour check).
  # ----------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.tzcheck.outputs.should_run }}
    steps:
      - name: Check ET hour (DST guard)
        id: tzcheck
        run: |
          ET_HOUR=$((10#$(TZ=America/New_York date +%H)))
          ET_FULL=$(TZ=America/New_York date)
          UTC_FULL=$(date -u)
          echo "UTC time: $UTC_FULL"
          echo "ET  time: $ET_FULL"
          echo "ET hour:  $ET_HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — proceeding regardless of hour."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$ET_HOUR" -ge 16 ]; then
            echo "ET hour is $ET_HOUR (>= 16, at/after the 4 PM close) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ET hour is $ET_HOUR (before 16:00 / 4 PM close). Skipping scheduled run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The full pipeline requires three pre-feature inputs that are
      # gitignored on the repo (.gitignore: data/cache/*, except the
      # slim dashboard subset). The CI runner starts with a fresh
      # checkout so none of these are present — we must build them
      # from scratch every run.
      #
      # Order (matches local-dev README):
      #   1. compute.loader        → fetches OHLCV from yfinance for the
      #                              full universe + benchmarks, writes
      #                              data/cache/ohlcv_daily.parquet
      #   2. compute.data_quality  → reads OHLCV, writes
      #                              data/cache/data_quality_report.json
      #                              (PASS / WARNING / FAIL gates)
      #   3. compute.features      → consumes both above, writes
      #                              data/cache/features.parquet
      #
      # Last-good OHLCV carry-forward. Yahoo rate-limits the shared CI IP and
      # intermittently truncates ~70 names/run; the loader splices the fresh
      # fetch over this cache so coverage never collapses (see
      # compute/loader.merge_with_last_good). Unique key → always saves the
      # merged result; restore-keys → restores the most recent. The committed
      # data/cache/ohlcv_daily.parquet is the cold-start floor on a cache miss.
      - name: Restore last-good OHLCV
        uses: actions/cache@v4
        with:
          path: data/cache/ohlcv_daily.parquet
          key: ohlcv-lastgood-${{ github.run_id }}
          restore-keys: |
            ohlcv-lastgood-

      - name: Fetch OHLCV from yfinance
        run: python -m compute.loader

      - name: Run data-quality firewall
        run: python -m compute.data_quality

      - name: Compute features
        run: python -m compute.features

      - name: Standardize features (z-scores)
        run: python -m compute.standardization

      - name: Run end-to-end pipeline
        run: python -m compute.pipeline

      - name: Build slim dashboard cache for Streamlit Cloud
        run: python -m compute.build_dashboard_cache

      # CRITICAL HARD GATES (Phase 14R.J).
      # Tests run BEFORE the dashboard-cache commit, so a broken pipeline
      # cannot pollute the live site. If ANY of these four suites fail,
      # the workflow fails, no commit happens, and the prior good cache
      # stays in place on `main`. This is the "no issues whatsoever"
      # promise per user direction.
      #
      # Four hard-gate test suites:
      #   1. test_universe_coverage   — yfinance fetched all universe tickers,
      #                                 latest date recent, benchmarks present,
      #                                 data quality firewall passes ≥ 90%.
      #   2. test_cache_freshness     — dashboard caches present + non-empty,
      #                                 latest date within 7 days, 11 sanity
      #                                 checks pass, regime context current.
      #   3. test_pipeline_integrity  — 11 sanity checks pass, CCQS in [0,100],
      #                                 grade/state/tier/setup distributions
      #                                 non-degenerate, STATE_WEIGHTS sum to
      #                                 1.0, confidence-blend mechanism intact.
      #   4. tests/reference/test_tv_parity — 10 canary tickers numerically
      #                                       pinned (140 field checks).
      #
      # Legacy spot-check tests run AFTER the commit (soft gates).
      - name: Install pytest
        run: pip install pytest

      - name: Hard-gate tests (universe / cache / pipeline / IC baseline / TV parity)
        run: |
          pytest tests/test_universe_coverage.py \
                 tests/test_cache_freshness.py \
                 tests/test_pipeline_integrity.py \
                 tests/test_ic_baseline.py \
                 tests/reference/test_tv_parity.py \
                 -v --tb=short

      - name: Commit refreshed dashboard cache to main (only if hard-gate tests pass)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/dashboard/
          if git diff --cached --quiet; then
            echo "No dashboard cache changes to commit."
            exit 0
          fi

          # Phase 30.8 (2026-06-03) — robust commit-and-push that survives
          # concurrent runs writing the same binary parquets.
          #
          # Prior implementation used `git pull --rebase` which fails on
          # binary parquet conflicts (today's Run #20 failed this way:
          # Run #19 had committed slightly-different parquets, rebase
          # couldn't auto-merge the binaries, all 3 push retries failed,
          # and Run #20's fresh post-close data was discarded).
          #
          # New approach: snapshot our freshly-computed parquets, reset
          # working tree to latest origin/main, re-apply our parquets on
          # top, commit, push. The LATER run's data always wins — which
          # is the correct semantic since by construction the later run
          # has fresher OHLCV input.
          #
          # The retry loop handles the (rare) case where another commit
          # lands between our fetch and our push.

          # 1. Save freshly-computed parquets out of the working tree
          SAVE_DIR=$(mktemp -d)
          cp -a data/cache/dashboard "$SAVE_DIR/"

          for attempt in 1 2 3; do
            # 2. Get latest remote state
            git fetch origin main

            # 3. Reset working tree to latest origin/main, discarding
            #    any prior loop-iteration commits
            git reset --hard origin/main

            # 4. Re-apply our parquets on top of latest main
            rm -rf data/cache/dashboard
            cp -a "$SAVE_DIR/dashboard" data/cache/dashboard

            # 5. Stage and check for diff vs latest main
            git add data/cache/dashboard/
            if git diff --cached --quiet; then
              echo "No dashboard cache changes vs latest main after re-baseline; another run already committed equivalent data."
              rm -rf "$SAVE_DIR"
              exit 0
            fi

            # 6. Commit
            git commit -m "ci: refresh dashboard cache ($(date -u +%Y-%m-%d))"

            # 7. Push
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              rm -rf "$SAVE_DIR"
              exit 0
            fi

            echo "Push attempt $attempt failed (likely a concurrent commit landed in the same window); re-fetching and retrying..."
            sleep 5
          done

          rm -rf "$SAVE_DIR"
          echo "Push failed after 3 attempts"
          exit 1

      - name: Soft-gate legacy spot-check tests
        run: |
          pytest tests/test_phase2_spot_check.py tests/test_phase3_validation.py -v --tb=short
        continue-on-error: true

      - name: Upload data/cache artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccqs-cache-${{ github.run_number }}
          path: |
            data/cache/
            !data/cache/sandbox/
          retention-days: 90

      - name: Upload sanity-checks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-checks-${{ github.run_number }}
          path: data/cache/sanity_checks.json
          retention-days: 90
